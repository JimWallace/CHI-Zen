name: Build

# Builds the CHI Zen manual and the starter paper on every push and pull
# request, the way students should compile them on Overleaf: LuaLaTeX on
# TeX Live 2026 (see the manual, Section "Overleaf Settings"). The PDFs are tagged (\DocumentMetadata), so
# they are then validated with veraPDF against PDF/UA-2 (accessibility) and
# PDF/A-4f (archiving). A second job checks that both documents still
# compile with pdfLaTeX, Overleaf's default compiler.
#
# The starter paper is built twice: in draft mode, which saves its figures
# as figures/tikz/*.pdf (TikZ external), and then in final mode (camera-
# ready for ACM's TAPS) from those PDFs. The final-mode PDF must pass
# veraPDF too, and the final-mode build must load only packages on ACM's
# accepted list (CHIZen/taps-accepted-packages.txt).
#
# Finally, no build may produce a LaTeX or BibTeX warning: see the
# warning ratchet step.

on:
  push:
  pull_request:

env:
  VERAPDF_VERSION: "1.30.4"
  VERAPDF_SHA256: "04415ef3f149526a3048b9889723e81320ddf013bd891bcc7f0f297f3eadcc23"

jobs:
  build:
    name: Build PDFs (${{ matrix.engine }})
    runs-on: ubuntu-latest
    # TeX Live 2026 (2026-10-01 snapshot), pinned by digest; Overleaf is on
    # TeX Live 2026 too.
    container: ghcr.io/xu-cheng/texlive-debian:20261001@sha256:78ac2204b8df113aca0561e8f173ad5b89ee51e90795173d2fe9bcf0fbce162e
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: lualatex
            flags: ""
          # markdown needs shell escape under pdfLaTeX (Overleaf enables it).
          - engine: pdflatex
            flags: "-shell-escape"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # minted runs Python/Pygments; veraPDF needs Java; svg would need
      # Inkscape (not used by the documents at the moment).
      - name: Install Python, Java and Inkscape
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            inkscape python3 python3-pygments python3-pip default-jre-headless unzip curl ca-certificates

      - name: Build the manual (CHIZen-Manual.tex)
        run: latexmk -${{ matrix.engine }} ${{ matrix.flags }} -interaction=nonstopmode -halt-on-error -file-line-error CHIZen-Manual.tex

      # Draft mode. The committed figure PDFs are deleted first, so this
      # build must save them again (latexmkrc turns on shell escape).
      - name: Build the starter paper in draft mode (00-my-new-paper.tex), saving its figure PDFs
        run: |
          rm -f figures/tikz/*.pdf figures/tikz/*.md5 figures/tikz/*.dpth
          latexmk -${{ matrix.engine }} ${{ matrix.flags }} -interaction=nonstopmode -halt-on-error -file-line-error 00-my-new-paper.tex
          if grep -q 'Shell escape is off' 00-my-new-paper.log; then
            echo "::error::TikZ could not save the figure PDFs (no shell escape)"; exit 1
          fi
          ls -l figures/tikz/*.pdf

      # Final mode, as a student switches it: the same file with
      # \def\chizenmode{final}, using the figure PDFs saved above.
      - name: Build the starter paper in final mode (camera-ready for ACM TAPS)
        run: |
          sed 's/^\\def\\chizenmode{draft}/\\def\\chizenmode{final}/' 00-my-new-paper.tex > 00-my-new-paper-final.tex
          grep -q '^\\def\\chizenmode{final}' 00-my-new-paper-final.tex || { echo "::error::could not switch 00-my-new-paper.tex to final mode"; exit 1; }
          latexmk -${{ matrix.engine }} ${{ matrix.flags }} -interaction=nonstopmode -halt-on-error -file-line-error 00-my-new-paper-final.tex
          grep -q '^CHIZen: final mode' 00-my-new-paper-final.log

      # Only packages on ACM's accepted list, none that acmart already
      # loads, and nothing else loaded (see the script).
      - name: Check that final mode loads only TAPS-accepted packages
        run: python3 .github/scripts/check_taps_packages.py 00-my-new-paper-final.tex --engine ${{ matrix.engine }}

      - name: Install veraPDF ${{ env.VERAPDF_VERSION }}
        if: matrix.engine == 'lualatex'
        run: |
          curl -sSL -o verapdf.zip "https://software.verapdf.org/releases/1.30/verapdf-greenfield-${VERAPDF_VERSION}-installer.zip"
          echo "${VERAPDF_SHA256}  verapdf.zip" | sha256sum -c -
          unzip -q verapdf.zip -d verapdf-installer
          cat > auto-install.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>/opt/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Batch files" selected="true"/>
              <pack index="2" name="veraPDF Validation model" selected="false"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar verapdf-installer/*/verapdf-izpack-installer-*.jar auto-install.xml
          /opt/verapdf/verapdf --version

      # Both documents must validate as PDF/UA-2 and PDF/A-4f. (Avoid
      # subfigures: subcaption is not yet compatible with tagging.)
      - name: Validate with veraPDF (PDF/UA-2, PDF/A-4f)
        if: matrix.engine == 'lualatex'
        run: |
          status=0
          check () {  # file flavour required
            if /opt/verapdf/verapdf --flavour "$2" --format text "$1"; then
              echo "::notice::$1 is valid $2"
            elif [ "$3" = required ]; then
              echo "::error::$1 is not valid $2"; status=1
              /opt/verapdf/verapdf --flavour "$2" --format text -v --maxfailuresdisplayed 3 "$1" | head -60 || true
            else
              echo "::warning::$1 is not valid $2 (known issue: subcaption is not yet compatible with tagging)"
              /opt/verapdf/verapdf --flavour "$2" --format text -v --maxfailuresdisplayed 3 "$1" | head -60 || true
            fi
          }
          check 00-my-new-paper.pdf ua2 required
          check 00-my-new-paper.pdf 4f  required
          check 00-my-new-paper-final.pdf ua2 required
          check 00-my-new-paper-final.pdf 4f  required
          check CHIZen-Manual.pdf   ua2 required
          check CHIZen-Manual.pdf   4f  required
          exit $status

      # Zero warnings: every LaTeX, package, font and BibTeX warning, undefined
      # reference and overfull box in every document and mode built above
      # (and in the figure runs of TikZ external) fails, unless it is listed in
      # chizen-warnings-baseline.txt, which checks.yml keeps empty. See the
      # script's docstring for what counts and the short allowlist.
      - name: No LaTeX or BibTeX warnings (warning ratchet)
        run: >-
          python3 plugins/chizen/skills/review/scripts/warning_ratchet.py --label ${{ matrix.engine }}
          CHIZen-Manual 00-my-new-paper 00-my-new-paper-final 'figures/tikz/*'

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-${{ matrix.engine }}
          path: |
            CHIZen-Manual.pdf
            00-my-new-paper.pdf
            00-my-new-paper-final.pdf
            figures/tikz/*.pdf
          if-no-files-found: warn

      - name: Show LaTeX errors on failure
        if: failure()
        run: |
          grep -n -A8 -E '^!|^[^ ]+:[0-9]+: ' *.log figures/tikz/*.log || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.engine }}
          path: |
            *.log
            *.blg
            figures/tikz/*.log
